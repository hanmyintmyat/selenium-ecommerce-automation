[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
xfail_strict = true
log_cli = false
log_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: critical login, inventory, cart, and purchase journeys (subset of regression)
    regression: complete UI and framework lifecycle regression suite, including smoke
    login: authentication and login validation scenarios
    checkout: customer information and purchase workflows
    cart: shopping cart behavior and navigation
    framework: browser lifecycle, diagnostics, and original-error preservation
